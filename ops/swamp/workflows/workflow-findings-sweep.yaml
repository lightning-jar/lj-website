# Findings-series source sweep — weekly detect, draft, notify. Runs the
# repo's findings-sweep probe (extracts finding-shaped claims from the
# source corpora, diffs against the last snapshot); when new claims
# appear, a second stage creates CMS DRAFT STUBS in the Findings blog
# (verbatim source block + review banner, never published) and the
# email says drafts are ready for review. Publishing stays human. A
# probe that fails silently would be theater, so broken stages email too.
id: 6f2096bd-1f14-47de-94d4-2d4f8556beb1
name: findings-sweep
description: Weekly sweep of finding-shaped source corpora — email digest on new claims
version: 1
tags:
  team: lj-website
  pattern: monitoring
trigger:
  schedule: "30 6 * * 1"

inputs:
  type: object
  properties:
    sweepScript:
      type: string
      default: scripts/findings-sweep.ts
  required: []

jobs:
  - name: sweep
    steps:
      - name: run-sweep
        task:
          type: behavior
          behavior: lj-ops-script
          methodName: execute
          inputs:
            script: "${{ inputs.sweepScript }}"
            args: ""
            ignoreExitCode: true
        dataOutputOverrides:
          - specName: result
            lifetime: 90d
            tags:
              audit: findings-sweep

      - name: assert-nothing-new
        dependsOn:
          - step: run-sweep
            condition:
              type: succeeded
        task:
          type: assert
          expr: data.latest("lj-ops-script", "result").content.exitCode == 0
          message: "New finding-shaped claims detected in the source corpora — see the run-sweep log for the digest; an email was dispatched."
          severity: low

      - name: draft-stubs
        dependsOn:
          - step: assert-nothing-new
            condition:
              type: failed
        task:
          type: behavior
          behavior: lj-ops-script
          methodName: execute
          inputs:
            script: scripts/findings-draft-stubs.ts
            args: ""
            ignoreExitCode: false
        dataOutputOverrides:
          - specName: result
            lifetime: 90d
            tags:
              audit: findings-sweep

      - name: notify-drafts-ready
        dependsOn:
          - step: draft-stubs
            condition:
              type: succeeded
        allowFailure: true
        task:
          type: behavior
          behavior: replicator-notify
          methodName: execute
          inputs:
            subject: "Findings sweep: new draft stubs ready for review"
            body: >-
              The weekly findings sweep found new finding-shaped claims and
              created draft stubs in the Findings blog. Review them in the
              Replicator editor and publish, or ask the lj-website agent to
              rewrite them into house style first. Stub list: swamp workflow
              history findings-sweep (from ~/projects/lj-website/ops/swamp
              under varlock), draft-stubs step log.

      - name: notify-drafting-failed
        dependsOn:
          - step: draft-stubs
            condition:
              type: failed
        allowFailure: true
        task:
          type: behavior
          behavior: replicator-notify
          methodName: execute
          inputs:
            subject: "Findings sweep: new claims found but DRAFTING FAILED"
            body: >-
              The weekly findings sweep found new finding-shaped claims but
              the draft-stub stage failed (missing REPLICATOR_AGENT_KEY or
              MCP error), so no CMS drafts were created. The claims are in
              the sweep report; inspect swamp workflow history
              findings-sweep on lj-bench and re-run after fixing.

      - name: notify-probe-broken
        dependsOn:
          - step: run-sweep
            condition:
              type: failed
        allowFailure: true
        task:
          type: behavior
          behavior: replicator-notify
          methodName: execute
          inputs:
            subject: "Findings sweep PROBE ERROR"
            body: >-
              The findings-sweep probe itself failed to run (missing source
              file or setup error, not a content verdict). Inspect: swamp
              workflow history findings-sweep on lj-bench.
