<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<!-- fonts load from bunny.net; preconnect keeps the handshake out of
		     the critical window, and preloading the three latin faces gets
		     them in before first paint so the font swap has nothing to
		     shift (the metric fallbacks in uno.config cover the residue) -->
		<link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="https://fonts.bunny.net/bungee-shade/files/bungee-shade-latin-400-normal.woff2"
			crossorigin
		>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="https://fonts.bunny.net/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2"
			crossorigin
		>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="https://fonts.bunny.net/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2"
			crossorigin
		>

		<!-- DNS prefetch -->
		<link
			rel="dns-prefetch"
			href="https://lj-01.nyc3.cdn.digitaloceanspaces.com"
		>

		<!-- image preload -->
		<link
			rel="preload"
			as="image"
			href="https://lj-01.nyc3.cdn.digitaloceanspaces.com/images/logos/lightning-jar-word.svg"
			fetchpriority="high"
		>

		<link
			rel="preload"
			as="fetch"
			href="https://lj-01.nyc3.cdn.digitaloceanspaces.com/sounds/magic-click.mp3"
			crossorigin="anonymous"
		>

		<link
			rel="preload"
			as="fetch"
			href="https://lj-01.nyc3.cdn.digitaloceanspaces.com/sounds/click-short.mp3"
			crossorigin="anonymous"
		>

		<!-- CSP -->
		<!--<meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; frame-src 'self'; font-src 'self' https://fonts.bunny.net; img-src 'self' https://lj-01.nyc3.cdn.digitaloceanspaces.com; media-src 'self' https://lj-01.nyc3.cdn.digitaloceanspaces.com; style-src 'unsafe-inline' 'self' https://lj-01.nyc3.cdn.digitaloceanspaces.com; script-src 'self' 'sha256-YXOoinyatmABOduEfvaFA6G330E20K7l6OY8MBuERxw=' 'sha256-YXOoinyatmABOduEfvaFA6G330E20K7l6OY8MBuERxw=' 'sha256-NoqqQBFMr/TstJFNyv5+bfNEnPLEFhisISsVbIcl25E='; worker-src 'self' blob:"
    />-->

		<!-- viewport -->
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- favicons -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icon.svg">
		%sveltekit.head%

		<!-- Privacy-friendly analytics by Plausible -->
		<script
			async
			src="https://plausible.io/js/pa-iA_fpapqCPekvXSbd0CWo.js"
		></script>
		<script id="plausible-singleton">
		(() => {
			// Ensure a single global plausible function with a queue for early calls
			if (!window.plausible) {
				window.plausible = (...args) => {
					if (!window.plausible.q) {
						window.plausible.q = [];
					}
					window.plausible.q.push(args);
				};
			}

			// Provide an init method that stores options
			if (!window.plausible.init) {
				window.plausible.init = (options) => {
					if (!options) {
						options = {};
					}
					window.plausible.o = options;
				};
			}

			// Initialize with default options
			window.plausible.init();
		})();
		</script>

		<!-- mastodon -->
		<link rel="me" href="https://fosstodon.org/@kevinpeckham">
	</head>
	<body
		class="flex font-sans bg-oxford bg-gradient-to-br from-oxfordDark to-oxford text-neutral-100 max-w-screen overflow-x-hidden relative"
	>
		<div class="grid grid-cols-1 grid-rows-[auto_1fr_auto] min-h-screen w-full">
			%sveltekit.body%
		</div>
	</body>
</html>
