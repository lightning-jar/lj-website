    <script id="plausible-singleton">
      (() => {
        // Ensure a single global plausible function with a queue for early calls
        if (!window.plausible) {
          window.plausible = (...args) => {
            if (!window.plausible.q) {
              window.plausible.q = [];
            }
            window.plausible.q.push(args);

        // Provide an init method that stores options
        if (!window.plausible.init) {
          window.plausible.init = (options) => {
            if (!options) {
