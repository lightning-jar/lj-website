<!DOCTYPE html>
<html
	lang="en"
	class="scroll-smooth 2xl:text-[.96vw]"
>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<link
			rel="icon"
			href="favicon.ico"
			sizes="any"
		/>
		<link
			rel="icon"
			href="/icon.svg"
			type="image/svg+xml"
		/>
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon.png"
		/>
		<link
			rel="manifest"
			href="/site.webmanifest"
		/>
		%sveltekit.head%
	</head>
	<body class="flex justify-center bg-oxford text-neutral-100">
		<div class="relative w-full max-w-[1800px]">%sveltekit.body%</div>
	</body>
</html>
